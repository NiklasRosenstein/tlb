---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tlb-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tlb-controller
    app.kubernetes.io/instance: tlb-controller
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tlb-controller
  labels:
    app.kubernetes.io/name: tlb-controller
    app.kubernetes.io/instance: tlb-controller
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - patch # for annotations and finalizer
  - apiGroups: [""]
    resources:
      - services/finalizers
    verbs:
      - update
  - apiGroups: [""]
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs:
      - list
      - watch
      - create
      - get
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - delete
      - list
      - watch
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - delete
      - get
      - create
      - list
      - watch
      - patch
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tlb.io"]
    resources:
      - clustertunnelclasses
      - tunnelclasses
    verbs:
      - get
      - list
      - watch
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tlb-controller
  labels:
    app.kubernetes.io/name: tlb-controller
    app.kubernetes.io/instance: tlb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tlb-controller
subjects:
  - kind: ServiceAccount
    name: tlb-controller
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tlb-controller-journal
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tlb-controller-journal
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tlb-controller-journal
subjects:
  - kind: ServiceAccount
    name: tlb-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tlb-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tlb-controller
    app.kubernetes.io/instance: tlb-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tlb-controller
      app.kubernetes.io/instance: tlb-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tlb-controller
        app.kubernetes.io/instance: tlb-controller
    spec:
      serviceAccountName: tlb-controller
      containers:
        - name: tlb-controller
          image: "ghcr.io/niklasrosenstein/tlb:0.7.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TLB_ALLOW_UNSAFE_WORKLOAD_OVERRIDES
              value: "false"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
