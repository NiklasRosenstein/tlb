[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
deno = "2.9.6"

# Type checking

[tasks.crate-check]
run = "cargo check --locked --all-targets --all-features"

[tasks.scripts-check]
run = "deno check scripts"

[tasks.check]
depends = ["crate-check", "scripts-check"]

# Formatting

[tasks.crate-fmt]
run = "cargo fmt --all"

[tasks.aux-fmt]
run = "deno fmt README.md .github/ --line-width 120"

[tasks.scripts-fmt]
run = "deno fmt scripts --line-width 120"

[tasks.fmt]
depends = ["crate-fmt", "aux-fmt", "scripts-fmt"]

# Formatting check

[tasks.crate-fmt-check]
run = "cargo fmt --all  --check"

[tasks.aux-fmt-check]
run = "deno fmt README.md .github/ --line-width 120  --check"

[tasks.scripts-fmt-check]
run = "deno fmt scripts --line-width 120 --check"

[tasks.fmt-check]
depends = ["crate-fmt-check", "aux-fmt-check", "scripts-fmt-check"]

# Linting

[tasks.crate-lint]
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.scripts-lint]
run = "deno lint scripts"

[tasks.lint]
depends = ["crate-lint", "scripts-lint"]

# Fixing

[tasks.crate-fix]
run = "cargo clippy --locked --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.scripts-fix]
run = "deno lint --fix scripts"

[tasks.fix]
depends = ["crate-fix", "scripts-fix"]

# Build

[tasks.crate-build]
run = "cargo build --locked --all-features"

[tasks.build]
depends = ["crate-build"]
wait_for = ["lint"]

# Tests

[tasks.crate-test]
run = "cargo test --locked --all-features"

[tasks.scripts-test]
run = "deno test scripts"

[tasks.test]
depends = ["crate-test", "scripts-test"]
wait_for = ["build"]

# CRDs

[tasks.update-crds]
depends = ["build"]
run = "cargo run --locked -- crds > ./helm/tlb-controller/templates/crds/crds.yaml"
wait_for = ["build", "test"]

[tasks.check-crds-uptodate]
depends = ["build"]
run = "bash -c 'diff -u helm/tlb-controller/templates/crds/crds.yaml <(cargo run --locked -- crds)'"
wait_for = ["build", "test"]

[tasks.ci]
depends = ["check", "fmt-check", "lint", "test", "build", "check-crds-uptodate"]

[tasks.e2e-quick-tunnel]
tools.kind = "0.33.0"
tools.helm = "4.2.4"
description = "Verify public Quick Tunnel traffic through the built image and Helm chart in kind"
run = "cargo run --locked --example quick-tunnel-e2e --"
