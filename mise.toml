[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
deno = "2.9.6"

# Type checking

[tasks.crate-check]
run = "cargo check --locked --all-targets --all-features"

[tasks.scripts-check]
run = "deno check scripts"

[tasks.check]
depends = ["crate-check", "scripts-check"]

# Formatting

[tasks.crate-fmt]
run = "cargo fmt --all"

[tasks.aux-fmt]
run = "deno fmt README.md .github/ --line-width 120"

[tasks.scripts-fmt]
run = "deno fmt scripts --line-width 120"

[tasks.fmt]
depends = ["crate-fmt", "aux-fmt", "scripts-fmt"]

# Formatting check

[tasks.crate-fmt-check]
run = "cargo fmt --all  --check"

[tasks.aux-fmt-check]
run = "deno fmt README.md .github/ --line-width 120  --check"

[tasks.scripts-fmt-check]
run = "deno fmt scripts --line-width 120 --check"

[tasks.fmt-check]
depends = ["crate-fmt-check", "aux-fmt-check", "scripts-fmt-check"]

# Linting

[tasks.crate-lint]
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.scripts-lint]
run = "deno lint scripts"

[tasks.lint]
depends = ["crate-lint", "scripts-lint"]

# Fixing

[tasks.crate-fix]
run = "cargo clippy --locked --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.scripts-fix]
run = "deno lint --fix scripts"

[tasks.fix]
depends = ["crate-fix", "scripts-fix"]

# Build

[tasks.crate-build]
run = "cargo build --locked --all-features"

[tasks.build]
depends = ["crate-build"]
wait_for = ["lint"]

# Tests

[tasks.crate-test]
run = "cargo test --locked --all-features"

[tasks.scripts-test]
run = "deno test scripts"

[tasks.test]
depends = ["crate-test", "scripts-test"]
wait_for = ["build"]

# CRDs

[tasks.update-crds]
depends = ["build"]
run = "cargo run --locked -- crds > ./deploy/crds.yaml && deno run --allow-read --allow-write scripts/manifests.ts"
wait_for = ["build", "test"]

[tasks.check-crds-uptodate]
depends = ["build"]
run = "bash -c 'diff -u deploy/crds.yaml <(cargo run --locked -- crds)'"
wait_for = ["build", "test"]

[tasks.check-manifests]
run = "deno run --allow-read scripts/manifests.ts --check"

[tasks.ci]
depends = ["check", "fmt-check", "lint", "test", "build", "check-crds-uptodate", "check-manifests"]

[tasks.e2e-quick-tunnel]
tools.kind = "0.33.0"
description = "Verify public Quick Tunnel traffic through the built image and installation manifest in kind"
run = "cargo run --locked --example quick-tunnel-e2e --"

[tasks.e2e-netbird]
tools.kind = "0.33.0"
description = "Verify NetBird forwarding and cleanup with an isolated server in kind"
run = "bash tests/netbird.sh"
