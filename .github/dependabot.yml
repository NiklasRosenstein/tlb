version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns:
          - kube*
          - k8s-openapi
          - schemars*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
