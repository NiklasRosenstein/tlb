name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: mise run ci

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: mise run e2e-kubernetes
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kubernetes-diagnostics
          path: /tmp/tlb-e2e-*/logs
          if-no-files-found: ignore

  netbird:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: mise run e2e-netbird
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: netbird-diagnostics
          path: /tmp/tlb-e2e-netbird-*/logs
          if-no-files-found: ignore
