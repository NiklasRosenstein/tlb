name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: mise run ci

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: mise install kind@0.33.0 helm@4.2.4
      - run: mise exec kind@0.33.0 helm@4.2.4 -- bash tests/kubernetes.sh
