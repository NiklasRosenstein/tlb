name: Quick Tunnel E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-tunnel-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quick-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - name: Build, install chart, and verify public HTTPS
        run: mise run e2e-quick-tunnel
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quick-tunnel-diagnostics
          path: /tmp/tlb-e2e-*/logs
          if-no-files-found: ignore
