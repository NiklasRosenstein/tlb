{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tlb-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tlb-controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tlb-controller.fullname" . }}
  labels:
    {{- include "tlb-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - patch # for annotations and finalizer
  - apiGroups: [""]
    resources:
      - services/finalizers
    verbs:
      - update
  - apiGroups: [""]
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs:
      - list
      - watch
      - create
      - get
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - delete
      - list
      - watch
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - delete
      - get
      - create
      - list
      - watch
      - patch
  - apiGroups: ["tlb.io"]
    resources:
      - clustertunnelclasses
      - tunnelclasses
    verbs:
      - get
      - list
      - watch
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tlb-controller.fullname" . }}
  labels:
    {{- include "tlb-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tlb-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tlb-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tlb-controller.fullname" . }}-journal
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tlb-controller.fullname" . }}-journal
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tlb-controller.fullname" . }}-journal
subjects:
  - kind: ServiceAccount
    name: {{ include "tlb-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
