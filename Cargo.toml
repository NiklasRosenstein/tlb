[package]
name = "tlb"
version = "0.6.5"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "controller"
path = "src/main.rs"

[[example]]
name = "quick-tunnel-e2e"
test = true

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.88"
base64 = "0.22"
clap = { version = "4.5.40", features = ["derive"] }
env_logger = "0.11.8"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json", "rustls-no-provider"], default-features = false }
kube = { version = "4.2.0", features = ["runtime", "client", "derive"] }
log = "0.4.27"
schemars = "1.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "signal"] }

futures = "0.3.34"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["process"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
